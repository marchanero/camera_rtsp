[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf"
  omit_hostname = false

[[outputs.influxdb_v2]]
  urls = ["http://camera_rtsp_influxdb:8086"]
  token = "galgo_secret_token_iot_2026"
  organization = "galgo"
  bucket = "sensors_data"

[[inputs.mqtt_consumer]]
  servers = ["tcp://camera_rtsp_emqx:1883"]
  topics = [
    "#"
  ]
  data_format = "json"
  # Usar el campo "type" del JSON como nombre de la medida (measurement)
  # json_name_key = "type"
  name_override = "mqtt_sensors"
  
  # Campos que queremos tratar como etiquetas (tags) en lugar de valores (fields)
  tag_keys = [
    "location",
    "scenarioId",
    "deviceId",
    "sensorId"
  ]

  # Especificar campos que son texto (si los hubiera) para evitar errores
  json_string_fields = ["location", "scenarioId", "deviceId", "sensorId"]

  # Extraer el tópico completo como etiqueta
  topic_tag = "topic"

  # Mapeo de campos si el JSON es simple
  # Si el JSON es {"value": 23.5, "battery": 90}
  # Telegraf lo guardará como campos automáticamente.
