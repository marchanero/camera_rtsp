[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf"
  omit_hostname = false
  # Enable debug logging to see what's happening
  debug = true

# Output to InfluxDB v2
[[outputs.influxdb_v2]]
  urls = ["http://camera_rtsp_influxdb:8086"]
  token = "galgo_secret_token_iot_2026"
  organization = "galgo"
  bucket = "sensors_data"

# ============================================================
# EmotiBit Sensor - Biometric data
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "emotibit"
  servers = ["tcp://camera_rtsp_emqx:1883"]
  username = "admin"
  password = "galgo2526"
  client_id = "telegraf_emotibit"
  
  topics = [
    "ETSIIAB/emotibit/+/data",
    "ETSIIAB/emotibit/+/status"
  ]
  
  qos = 1
  persistent_session = true
  
  # JSON parser for nested EmotiBit data
  data_format = "json"
  
  # Extract topic parts as tags
  topic_tag = "topic"
  
  # Tag keys to extract from JSON
  tag_keys = ["type", "status"]
  
  # String fields (avoid type conflicts)
  json_string_fields = ["status", "type"]

# ============================================================
# MOTA Sensor - Environmental data (Aguas Nuevas)
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "mota_sensor"
  servers = ["tcp://camera_rtsp_emqx:1883"]
  username = "admin"
  password = "galgo2526"
  client_id = "telegraf_mota"
  
  topics = [
    "AGUASNUEVASAB/sensor/+/#"
  ]
  
  qos = 1
  persistent_session = true
  
  data_format = "json"
  topic_tag = "topic"
  
  tag_keys = ["sensorId", "location", "deviceId"]
  json_string_fields = ["sensorId", "location", "deviceId"]

# ============================================================
# Generic sensor topics (catch-all for any other sensors)
# ============================================================
[[inputs.mqtt_consumer]]
  name_override = "mqtt_sensors"
  servers = ["tcp://camera_rtsp_emqx:1883"]
  username = "admin"
  password = "galgo2526"
  client_id = "telegraf_generic"
  
  topics = [
    "camera_rtsp/sensors/#"
  ]
  
  qos = 1
  persistent_session = true
  
  data_format = "json"
  topic_tag = "topic"
  
  tag_keys = ["sensorId", "type", "location", "scenarioId", "deviceId"]
  json_string_fields = ["sensorId", "type", "location", "scenarioId", "deviceId"]
